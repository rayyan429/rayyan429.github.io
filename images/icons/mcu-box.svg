<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <g stroke="#14161a" stroke-width="2.2" stroke-linejoin="round">
    <!-- inside back of the box -->
    <path d="M6 22l4-5h28l4 5Z" fill="#8a5a2b"/>
    <!-- blue Arduino-style board, tilted back-left -->
    <g transform="rotate(-14 17 16)">
      <rect x="9" y="7" width="16" height="15" rx="1.6" fill="#2f7fd6"/>
      <rect x="14" y="11.5" width="6" height="5.5" rx=".8" fill="#14161a" stroke-width="1.2"/>
    </g>
    <!-- green dev board with chip, tilted right -->
    <g transform="rotate(12 31 15)">
      <rect x="24.5" y="6" width="13" height="16" rx="1.6" fill="#3ecf74"/>
      <rect x="27.5" y="9" width="7" height="6" rx=".8" fill="#c3cad5" stroke-width="1.2"/>
    </g>
    <!-- front of the box -->
    <rect x="6" y="22" width="36" height="21" rx="2.2" fill="#d9a066"/>
    <path d="M6 22l-3-6h8.5Z" fill="#e8b984"/>
    <path d="M42 22l3-6h-8.5Z" fill="#e8b984"/>
  </g>
  <!-- header pins on the boards -->
  <g fill="#f4f5f7">
    <rect x="10.2" y="8.6" width="1.4" height="1.4" transform="rotate(-14 17 16)"/>
    <rect x="12.4" y="8.6" width="1.4" height="1.4" transform="rotate(-14 17 16)"/>
    <rect x="14.6" y="8.6" width="1.4" height="1.4" transform="rotate(-14 17 16)"/>
    <rect x="16.8" y="8.6" width="1.4" height="1.4" transform="rotate(-14 17 16)"/>
    <rect x="19" y="8.6" width="1.4" height="1.4" transform="rotate(-14 17 16)"/>
  </g>
  <circle cx="29.5" cy="18.5" r="1" fill="#ffd43b" transform="rotate(12 31 15)"/>
  <!-- inventory label -->
  <rect x="11" y="28" width="14" height="10" rx="1.2" fill="#f8f4ec" stroke="#14161a" stroke-width="1.4"/>
  <path d="M13.2 31.3h1.6M13.2 34.5h1.6" stroke="#3ecf74" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M16.6 31.3h6M16.6 34.5h4.5" stroke="#8a8f99" stroke-width="1.2" stroke-linecap="round"/>
  <!-- tape -->
  <rect x="30" y="23.2" width="6" height="18.6" fill="#f0d3a5" opacity=".85"/>
</svg>
